directives:

# Add iiwa
- add_model:
    name: iiwa
    file: package://ciris_pgd/models/iiwa14_primitive_collision.urdf
    default_joint_positions:
        iiwa_joint_1: [0]
        iiwa_joint_2: [0.3]
        iiwa_joint_3: [0]
        iiwa_joint_4: [-1.8]
        iiwa_joint_5: [0]
        iiwa_joint_6: [1]
        iiwa_joint_7: [1.57]

- add_weld:
    parent: world
    child: iiwa::base

# Add bins
- add_model:
    name: binR
    # file: package://drake/examples/manipulation_station/models/bin2.sdf
    file: package://drake_models/manipulation_station/bin2.sdf

- add_weld:
    parent: world
    child: binR::bin_base
    X_PC:
      translation: [-0.42, -0.57, 0]
      rotation: !Rpy { deg: [0.0, 0.0, 45.0 ]}
      

- add_model:
    name: binL
    # file: package://drake/examples/manipulation_station/models/bin2.sdf
    file: package://drake_models/manipulation_station/bin2.sdf

- add_weld:
    parent: world
    child: binL::bin_base
    X_PC:
      translation: [-0.42, 0.57, 0]
      rotation: !Rpy { deg: [0.0, 0.0, 135.0 ]}


- add_model:
    name: binF
    # file: package://drake/examples/manipulation_station/models/bin2.sdf
    file: package://drake_models/manipulation_station/bin2.sdf

- add_weld:
    parent: world
    child: binF::bin_base
    X_PC:
      translation: [0.75, 0, 0]
      rotation: !Rpy { deg: [0.0, 0.0, 0.0 ]}