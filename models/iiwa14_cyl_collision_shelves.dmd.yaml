directives:

# Add iiwa
- add_model:
    name: iiwa
    file: package://ciris_pgd/models/iiwa14_primitive_collision.urdf
    default_joint_positions:
        iiwa_joint_1: [0]
        iiwa_joint_2: [0.3]
        iiwa_joint_3: [0]
        iiwa_joint_4: [-1.8]
        iiwa_joint_5: [0]
        iiwa_joint_6: [1]
        iiwa_joint_7: [1.57]

- add_weld:
    parent: world
    child: iiwa::base


# Add shelves
- add_model:
    name: shelves
    # file: package://drake/examples/manipulation_station/models/shelves.sdf
    file: package://drake_models/manipulation_station/shelves.sdf

- add_weld:
    parent: world
    child: shelves::shelves_body
    X_PC:
      translation: [0.45, 0.67, 0.4]
      rotation: !Rpy { deg: [0.0, 0.0, 225.0 ]}


# Add shelves
- add_model:
    name: shelves2
    # file: package://drake/examples/manipulation_station/models/shelves.sdf
    file: package://drake_models/manipulation_station/shelves.sdf

- add_weld:
    parent: world
    child: shelves2::shelves_body
    X_PC:
      translation: [0.45, -0.67, 0.4]
      rotation: !Rpy { deg: [0.0, 0.0, 135.0 ]}
      

